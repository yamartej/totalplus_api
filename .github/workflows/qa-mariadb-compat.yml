name: TotalPlus QA MariaDB compatibility
on:
  pull_request:
    branches: [main, 'reengineering/phase0-2-20261025']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mariadb-feature:
    if: github.event_name == 'pull_request' && (github.head_ref == 'reengineering/phase0-2-20261025' || github.head_ref == 'reengineering/phase3-operations-20261026')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_DATABASE: totalplus_ci_mariadb
          MARIADB_USER: qa_runner
          MARIADB_PASSWORD: qa_ephemeral_only
          MARIADB_ROOT_PASSWORD: qa_root_ephemeral_only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h localhost -u root -pqa_root_ephemeral_only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: testing
      APP_DEBUG: 'true'
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: totalplus_ci_mariadb
      DB_USERNAME: qa_runner
      DB_PASSWORD: qa_ephemeral_only
      CACHE_DRIVER: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      TELESCOPE_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, dom, fileinfo, pdo_mysql, xml, curl, zip, bcmath
          coverage: none
      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Prepare ephemeral application
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan config:clear
      - name: Assert isolated MariaDB database
        run: |
          test "$DB_DATABASE" = "totalplus_ci_mariadb"
          php artisan tinker --execute="if (DB::connection()->getDatabaseName() !== 'totalplus_ci_mariadb') { throw new RuntimeException('Unexpected database'); } echo 'MariaDB target verified'.PHP_EOL;"
      - name: Complete regression on MariaDB
        run: php artisan test
